[project]
name = "hgraph-platform-tools"
version = "0.1.0"
description = "Platform tooling for the hgraph forward propagation graph framework. Provides trade booking, entitlements, static data admin, and notification pipelines."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Simon Kelly", email = "si.j.kelly@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "hgraph>=0.8.40,<0.9",
    "pandas>=2.0",
    "numpy>=1.23",
    "python-dotenv>=1.0",
    "xmlschema>=2.0",
]

[project.optional-dependencies]
messaging = [
    "kafka-python>=2.1.5",
]
notification = [
    "jinja2>=3.1",
]
database = [
    "pymongo>=4.0",
]
web = [
    "requests>=2.28",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]
ai = [
    "mcp>=2.0",
    "httpx>=0.27",
]
oap = [
    "hg-oap>=0.3.3",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "mypy>=1.5",
    "black>=25.1.0",
    "httpx>=0.27",
]
all = [
    "hgraph-platform-tools[messaging,notification,database,web,oap,api,ai]",
]
dev = [
    "hgraph-platform-tools[all,test]",
]

[project.scripts]
hgraph-tools = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------- uv ----------
# hg-oap is installed from the local clone on branch simon/extensions
# (fork: https://github.com/sijkelly/hg_oap). The parties, credit, regulatory
# and sales-order modules used here are not in the PyPI release.
[tool.uv.sources]
hg-oap = { path = "../hg_oap", editable = true }

[tool.hatch.build.targets.wheel]
packages = [
    "hgraph_trade",
    "hgraph_entitlements",
    "hgraph_notification",
    "hgraph_static_admin",
    "hgraph_oap_adapter",
    "hgraph_api",
    "hgraph_oms",
]

# The CLI entry point and the shared configuration are top-level modules
[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"secure_config.py" = "secure_config.py"

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "7.4"
pythonpath = [".", "../hg_oap/src"]
testpaths = ["tests"]
markers = [
    "smoke: Smoke tests for basic checkout",
    "serial: Tests that must run serially",
]

# ---------- coverage ----------
[tool.coverage.run]
source_pkgs = [
    "hgraph_trade",
    "hgraph_entitlements",
    "hgraph_notification",
    "hgraph_static_admin",
    "hgraph_oap_adapter",
    "hgraph_api",
    "hgraph_oms",
]
branch = true
parallel = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 55
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------- black ----------
[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
(
  \.claude/
  | venv_.*/
  | fpml_tag_dict_structure\.py
  | fpml_tags\.py
  | output_fpml_tags\.py
)
'''

# ---------- mypy ----------
[tool.mypy]
files = ["."]
ignore_missing_imports = true
exclude = [
    '^\.claude/',
    '^\.venv/',
    '^venv_.*/',
    'fpml_tag_dict_structure\.py$',
    'fpml_tags\.py$',
    'output_fpml_tags\.py$',
]

# hgraph node signatures use time-series types (TS[...], TSD[...]) as wiring
# annotations, which mypy cannot interpret. Keep those modules small and relax
# the affected checks only there.
[[tool.mypy.overrides]]
module = [
    "hgraph_oms.order_book",
    "hgraph_oms.engine_graph",
    "tests.hgraph_oms.test_order_book",
]
disable_error_code = ["type-arg", "attr-defined", "return-value", "assignment"]
